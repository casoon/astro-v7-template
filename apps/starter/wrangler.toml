name = "astro-v7-starter"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]

[assets]
html_handling = "force-trailing-slash"
# No `not_found_handling`: with "404-page", Cloudflare answers browser navigations to
# on-demand routes (e.g. /contact/) with the 404 page without ever invoking the Worker.
# Unmatched paths fall through to the Worker, which serves Astro's 404 page.

[observability]
enabled = true

# Astro sessions (Cloudflare KV). Without an `id`, `wrangler deploy` provisions the
# namespace automatically on first deploy. Pin your own id here afterwards if you want.
[[kv_namespaces]]
binding = "SESSION"

# Custom domain — uncomment and set your own domain. Without it the Worker is served
# on its workers.dev subdomain.
# [[routes]]
# pattern = "example.com"
# custom_domain = true
