packages:
  - "apps/*"
  - "shared"

allowBuilds:
  "@casoon/astro-post-audit": true
  esbuild: true
  sharp: true
  workerd: true

# Transitive dependencies pinned to patched versions (pnpm audit), all dev/build-time-only
# tooling (astro's asset pipeline, gray-matter, @astrojs/internal-helpers, vite/postcss,
# satori, and wrangler/miniflare's own sharp resolution).
overrides:
  "js-yaml@3": ^3.15.1
  "js-yaml@4": ^4.3.1
  fast-uri: ^3.1.9
  nanoid: ^3.3.18
  fflate: ^0.7.5
  svgo: ^4.1.0
  "undici@7": ^7.30.1
  "@tailwindcss/typography>postcss-selector-parser": ^7.1.6
  sharp: ^0.35.5

catalog:
  # Astro v7 (stable)
  astro: ^7.4.2
  "@astrojs/check": ^0.9.12
  "@astrojs/cloudflare": ^14.4.2
  "@astrojs/mdx": ^8.1.1
  "@astrojs/rss": ^4.0.19
  "@astrojs/svelte": ^9.1.1
  "@axe-core/playwright": ^4.14.0
  "@casoon/astro-post-audit": ^0.9.1
  "@casoon/astro-structured-data": ^2.3.0
  "@casoon/astro-site-files": ^0.7.0
  "@casoon/astro-speed-measure": ^0.4.0
  "@casoon/astro-webvitals": ^0.4.10

  # Tailwind v4
  tailwindcss: ^4.3.3
  "@tailwindcss/typography": ^0.5.20
  "@tailwindcss/vite": ^4.3.3
  tailwindcss-animate: ^1.0.7

  # Svelte 5
  svelte: ^5.57.2
  "@lucide/svelte": ^1.61.0

  # Core
  gray-matter: ^4.0.3
  prop-for-that: ^0.7.12
  # rehype-slug and remark-gfm removed — Sätteri (Astro v7 default markdown) provides both natively
  "@types/node": ^24.0.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  zod: ^4.6.7
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  satori: ^0.63.2
  "@resvg/resvg-js": ^2.6.2
  sharp: ^0.35.5

  # Code analysis
  fallow: ^3.35.0

  # Deployment
  wrangler: ^4.152.0

  # Formatting & Linting (Biome only - no more ESLint/Prettier hybrid)
  "@biomejs/biome": ^2.6.3
  husky: ^9.1.7
  lint-staged: ^17.6.0

  # Fonts (reduced set)
  "@fontsource/inter": ^5.3.0
  "@fontsource/lora": ^5.3.0
  "@fontsource/fira-code": ^5.3.0
